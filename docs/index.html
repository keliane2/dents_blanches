<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Dents Blanches</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body,
        html {
            height: 100vh;
        }

        .hero {
            height: 100vh;
            width: 100vw;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hero img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.55);
            width: 100%;
            animation: fadeUp 1.2s ease-out;
            display: inline;
            position: relative;
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 650px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(\0px);
            }
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        a.whatsapp-btn {
            display: inline-block;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .whatsapp-btn {
            animation: pulse 2s infinite;
        }

        a.whatsapp-btn:hover {
            background-color: #1ebe5d;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            a.whatsapp-btn {
                font-size: 1rem;
                padding: 12px 20px;
            }
        }

        /* Top-info juste au-dessus du bloc central */
        .top-info {
            margin-bottom: 12px; /* distance contrôlée */
        }

        .top-info p {
            color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            font-size: 2.2rem;
            margin: 2px 0;
            /* moins d’espace pour rapprocher */
            font-weight: 600;
        }

        .top-info p.location i {
            margin-right: 6px;
            color: red;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .top-info p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <section class="hero">
        <img src="denti_bianchi.png" alt="Image femme avec dents blanches" />
        <div class="top-info">
            <p class="location">
                <i class="fas fa-location-dot"></i> Niamey – Niger
            </p>
            <p class="appointment">Sur rendez-vous</p>
        </div>
        <div class="overlay">
            <h1>Bienvenue chez Dents Blanches<br />Blanchiment dentaire & Détartrage</h1>
            <a class="whatsapp-btn" href="https://wa.me/+22792167942" target="_blank">
                Cliquez ici pour nous contacter sur WhatsApp
            </a>
        </div>
    </section>
</body>

</html>
